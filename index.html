<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>月墨幸存者</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f7f1e7'/%3E%3Cpath d='M32 9c13 9 19 18 19 29 0 10-8 17-19 17s-19-7-19-17c0-11 6-20 19-29Z' fill='%231f2630'/%3E%3Cpath d='M32 15c7 8 10 15 10 22 0 6-4 10-10 10s-10-4-10-10c0-7 3-14 10-22Z' fill='%232b7a78'/%3E%3Ccircle cx='25' cy='34' r='3' fill='%23fff9ed'/%3E%3Ccircle cx='39' cy='34' r='3' fill='%23fff9ed'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="月墨幸存者游戏画布"></canvas>

      <section class="hud" aria-live="polite">
        <div class="brand">
          <span class="mark"></span>
          <div>
            <strong>月墨幸存者</strong>
            <small id="runSubtitle">第 1 潮</small>
          </div>
        </div>
        <div class="stats">
          <div><span>时间</span><strong id="timeText">00:00</strong></div>
          <div><span>等级</span><strong id="levelText">1</strong></div>
          <div><span>月露</span><strong id="xpText">0 / 8</strong></div>
          <div><span>击破</span><strong id="killText">0</strong></div>
          <div><span>构筑</span><strong id="buildText">0 / 0</strong></div>
        </div>
        <div class="hud-actions">
          <button id="pauseButton" class="hud-button pause-button" type="button" aria-label="暂停游戏">暂停</button>
          <button id="codexButton" class="hud-button codex-button" type="button" aria-label="打开武器展示">图鉴</button>
        </div>
      </section>

      <aside id="weaponBuildPanel" class="build-panel build-weapons" aria-label="已选择武器"></aside>
      <aside id="relicBuildPanel" class="build-panel build-relics" aria-label="已选择遗物"></aside>
      <aside id="traitBuildPanel" class="build-panel build-traits" aria-label="已选择特性"></aside>

      <div class="bars">
        <div class="bar health" role="progressbar" aria-label="生命值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <span id="healthBar"></span>
          <strong id="healthText" class="bar-label">生命 100 / 100 · 100%</strong>
        </div>
        <div class="bar xp"><span id="xpBar"></span></div>
      </div>

      <div id="pageTransition" class="page-transition" aria-hidden="true">
        <span class="transition-orb"></span>
        <span class="transition-stroke stroke-one"></span>
        <span class="transition-stroke stroke-two"></span>
        <span class="transition-spark spark-one"></span>
        <span class="transition-spark spark-two"></span>
        <span class="transition-spark spark-three"></span>
      </div>

      <section id="startOverlay" class="overlay visible">
        <div class="title-lockup">
          <span class="eyebrow">Ink Bloom Roguelite</span>
          <h1>月墨幸存者</h1>
          <p>在流动的夜色中穿行，让笔锋、星铃与月焰替你清场。</p>
          <div id="characterSelect" class="character-select" role="radiogroup" aria-label="选择角色"></div>
          <button id="startButton" type="button">开始远行</button>
        </div>
      </section>

      <section id="upgradeOverlay" class="overlay upgrade">
        <div class="upgrade-panel">
          <span class="eyebrow">Choose A Bloom</span>
          <h2>月露凝成新的技艺</h2>
          <div id="upgradePlan" class="upgrade-plan" aria-live="polite"></div>
          <div id="upgradeChoices" class="choices"></div>
        </div>
      </section>

      <section id="chestOverlay" class="overlay chest-overlay">
        <div class="chest-panel">
          <span class="eyebrow">Treasure Bloom</span>
          <h2 id="chestTitle">月匣正在开启</h2>
          <div class="chest-stage" id="chestStage">
            <div class="chest-vault">
              <span class="vault-core"></span>
              <span class="vault-ring ring-a"></span>
              <span class="vault-ring ring-b"></span>
              <span class="vault-beam beam-a"></span>
              <span class="vault-beam beam-b"></span>
              <span class="vault-spark spark-a"></span>
              <span class="vault-spark spark-b"></span>
              <span class="vault-spark spark-c"></span>
            </div>
          </div>
          <div id="chestRewards" class="chest-rewards"></div>
          <button id="chestContinueButton" class="chest-continue" type="button">收下奖励</button>
          <p id="chestHint" class="chest-hint">连点几次可跳过开箱特效</p>
        </div>
      </section>

      <section id="codexOverlay" class="overlay codex-overlay">
        <div class="codex-panel">
          <header class="codex-header">
            <div>
              <span class="eyebrow">Arsenal Codex</span>
              <h2>月墨武器图鉴</h2>
            </div>
            <button id="codexCloseButton" class="codex-close" type="button" aria-label="关闭武器展示">关闭</button>
          </header>
          <div id="codexSummary" class="codex-summary"></div>
          <div id="codexGrid" class="codex-grid"></div>
        </div>
      </section>

      <section id="pauseOverlay" class="overlay pause-overlay" aria-modal="true" aria-label="暂停菜单">
        <div class="pause-panel">
          <span class="eyebrow">Run Paused</span>
          <h2>墨息暂凝</h2>
          <p>当前战斗已停住。可以继续这一局，也可以重新开始或回到角色选择。</p>
          <div class="pause-actions">
            <button id="resumeButton" type="button">继续</button>
            <button id="pauseRestartButton" type="button">重新开始</button>
            <button id="mainMenuButton" type="button">回到主菜单</button>
          </div>
        </div>
      </section>

      <section id="gameOverOverlay" class="overlay">
        <div class="title-lockup compact">
          <span class="eyebrow">Run Complete</span>
          <h2 id="gameOverTitle">夜色合拢</h2>
          <p id="gameOverStats"></p>
          <button id="restartButton" type="button">再来一局</button>
        </div>
      </section>

      <div id="touchStick" class="touch-stick" aria-hidden="true">
        <span></span>
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
